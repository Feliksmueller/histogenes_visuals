<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Leobersdorf — Grave Finds</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <style>
    body, html { margin:0; padding:0; height:100%; font-family:system-ui,sans-serif; background:#EEE9E1; }
    #map { width:100%; height:100vh; }

    /* ── tooltip ── */
    .tt {
      position:absolute;
      background:rgba(253,251,248,.95);
      color:#1C1915;
      padding:7px 11px;
      border-radius:7px;
      font-size:12px;
      line-height:1.55;
      pointer-events:none;
      backdrop-filter:blur(4px);
      border:1px solid rgba(0,0,0,.10);
      box-shadow:0 2px 8px rgba(0,0,0,.12);
      max-width:200px;
    }
    .tt strong { display:block; font-size:13px; margin-bottom:2px; }

    /* ── legend ── */
    #legend {
      position:absolute; bottom:28px; left:14px;
      background:rgba(253,251,248,.92);
      color:#1C1915; padding:14px 16px;
      border-radius:9px; font-size:12px; line-height:1.7;
      backdrop-filter:blur(6px);
      border:1px solid rgba(0,0,0,.09);
      box-shadow:0 2px 8px rgba(0,0,0,.10);
    }
    #legend h4 {
      font-size:9.5px; letter-spacing:.09em;
      text-transform:uppercase; color:#9A9590;
      margin-bottom:10px;
    }
    .lr { display:flex; align-items:center; gap:9px; }
    .lr + .lr { margin-top:5px; }
    .sw.gm { width:14px; height:14px; border-radius:3px; background:#4A8A6A; flex-shrink:0; }
    .sw.gu { width:14px; height:14px; border-radius:3px; background:#A09890; flex-shrink:0; }

    /* ── zoom / interaction hint ── */
    #hint {
      position:absolute; top:14px; left:50%;
      transform:translateX(-50%);
      background:rgba(253,251,248,.88);
      color:#5E5A54; padding:5px 14px;
      border-radius:20px; font-size:11.5px;
      backdrop-filter:blur(4px);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 4px rgba(0,0,0,.08);
      pointer-events:none;
      transition:opacity .4s;
      white-space:nowrap;
    }

    /* ── image popup overlay ── */
    #img-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(20,16,12,.65);
      z-index:2000; align-items:center; justify-content:center;
      backdrop-filter:blur(4px);
    }
    #img-overlay.open { display:flex; }
    #img-card {
      background:#FDFBF8; border-radius:14px;
      padding:24px 26px 20px; max-width:600px; width:92%;
      position:relative;
      box-shadow:0 10px 48px rgba(0,0,0,.40);
      animation:popIn .18s ease-out;
    }
    @keyframes popIn {
      from { transform:scale(.93); opacity:0; }
      to   { transform:scale(1);   opacity:1; }
    }
    #img-close {
      position:absolute; top:13px; right:15px;
      background:none; border:none;
      font-size:20px; line-height:1; cursor:pointer;
      color:#7A766E; width:28px; height:28px;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%; transition:background .12s, color .12s;
    }
    #img-close:hover { background:rgba(0,0,0,.07); color:#1C1915; }
    #img-grave-id {
      font-size:15px; font-weight:700; color:#1C1915;
      margin:0 28px 14px 0;
    }
    #img-grid {
      display:flex; gap:10px; justify-content:center;
    }
    #img-grid img {
      flex:1 1 0; min-width:0; max-height:260px;
      border-radius:8px; object-fit:cover;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
    }
    #img-caption {
      margin-top:12px; font-size:10px; color:#B0ACA6;
      text-align:center; letter-spacing:.04em;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div class="tt" id="tt" style="display:none"></div>
<div id="hint">Zoom in to Leobersdorf to see &amp; click individual graves</div>
<div id="legend">

  <div class="lr"><span class="sw gm"></span>Matched to individual</div>
  <div class="lr"><span class="sw gu"></span>No individual</div>
</div>

<div id="img-overlay" onclick="if(event.target===this)closePopup()">

    <div id="img-grave-id"></div>
    <div id="img-grid"></div>

</div>

const tt   = document.getElementById('tt');
const hint = document.getElementById('hint');

map.on('zoom', () => {
  hint.textContent = map.getZoom() >= 13
    ? 'Click any grave to see its finds'
    : 'Zoom in to Leobersdorf to see & click individual graves';
});

// ── Popup ──────────────────────────────────────────────────────────────────
function showPopup(gid) {
  const imgs = graveImages[gid];
  if (!imgs || imgs.length === 0) return;
  document.getElementById('img-grave-id').textContent = gid;
  const grid = document.getElementById('img-grid');
  grid.innerHTML = '';
  imgs.forEach(name => {
    const img = document.createElement('img');
    img.src   = imageData[name] || '';
    img.alt   = name;
    img.title = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
    grid.appendChild(img);
  });
  document.getElementById('img-overlay').classList.add('open');
}

function closePopup() {
  document.getElementById('img-overlay').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePopup();
});

map.on('load', () => {

  // remove symbol clutter at low zoom
  map.getStyle().layers.forEach(l => {
    if (l.type === 'symbol') {
      try { map.removeLayer(l.id); } catch(e) {}
    }
  });

  map.addSource('graves', { type:'geojson', data:graves });

  // Grave fill
  map.addLayer({
    id:'graves-fill', type:'fill', source:'graves',
    minzoom: 13,
    paint:{
      'fill-color': ['case', ['==',['get','has_individual'],true], '#4A8A6A', '#A09890'],
      'fill-opacity': ['case', ['==',['get','has_individual'],true], 0.60, 0.35]
    }
  });

  // Grave outline
  map.addLayer({
    id:'graves-outline', type:'line', source:'graves',
    minzoom: 13,
    paint:{
      'line-color': ['case', ['==',['get','has_individual'],true], '#1E5C3A', '#6A6460'],
      'line-width': ['case', ['==',['get','has_individual'],true], 1.4, 0.7]
    }
  });

  // Hover highlight
  map.addLayer({
    id:'graves-hover', type:'fill', source:'graves',
    minzoom: 13,
    paint:{ 'fill-color':'#FFFFFF', 'fill-opacity':0.28 },
    filter:['==','grave_id','']
  });

  // ── Tooltip on grave hover ──────────────────────────────────────────────
  map.on('mousemove', 'graves-fill', (e) => {
    const p = e.features[0].properties;
    tt.innerHTML =
      `<strong>${p.grave_id}</strong>` +
      (p.has_individual
        ? `<div>Person: ${p.person_id}</div><span style="color:#C87941;font-size:11px">✓ matched · click for finds</span>`
        : `<span style="color:#7A766E;font-size:11px">no individual · click for finds</span>`);
    tt.style.display = 'block';
    tt.style.left = (e.point.x + 14) + 'px';
    tt.style.top  = (e.point.y + 14) + 'px';
    map.setFilter('graves-hover', ['==','grave_id', p.grave_id]);
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'graves-fill', () => {
    tt.style.display = 'none';
    map.setFilter('graves-hover', ['==','grave_id','']);
    map.getCanvas().style.cursor = '';
  });

  // ── Click: show photo popup ─────────────────────────────────────────────
  map.on('click', 'graves-fill', (e) => {
    showPopup(e.features[0].properties.grave_id);
  });

});
</script>
