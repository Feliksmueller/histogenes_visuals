<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Leobersdorf — kinship and graves</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --ground: #E2D9CA;  --paper: #EFE9DE;  --ink: #2B2722;  --muted: #7A7164;
    --line: #5C554B;    --sel: #F0C040; --r1: #FFFFFF; --r2: #C9D6E3;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground);
               font-family: system-ui, sans-serif; color: var(--ink); }

  #panel-ped, #panel-map { position: fixed; top: 0; bottom: 0; }
  #panel-ped { left: 0; width: 56%; background: var(--paper); }
  #panel-map { right: 0; width: 44%; border-left: 3px solid var(--ground); }
  #map { position: absolute; inset: 0; }
  @media (max-width: 820px) {
    #panel-ped { width: 100%; bottom: 50%; }
    #panel-map { width: 100%; top: 50%; border-left: 0; border-top: 3px solid var(--ground); }
  }

  /* ── pedigree ── */
  #ped { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #ped.dragging { cursor: grabbing; }
  .ring { fill: none; stroke: #D5CCBD; stroke-width: 1; }
  .ring-no { font-size: 12px; fill: var(--muted); text-anchor: middle; font-weight: 600; }
  .ring-cap { font-size: 11px; fill: var(--muted); text-anchor: middle; }
  .band-title { font-size: 13px; fill: var(--muted); font-weight: 600; }
  .band-title tspan { font-weight: 400; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.1; opacity: .55;
          transition: opacity .25s, stroke .25s, stroke-width .25s; }
  .e-noparent { stroke-dasharray: 2 3; }
  .e-same { stroke: #C98AA6; stroke-dasharray: 3 4; opacity: .7; }
  .node { cursor: pointer; transition: opacity .25s; }
  .node > rect, .node > circle, .node > polygon {
          fill: var(--c, #fff); stroke: #3B352E; stroke-width: 1; transition: stroke .2s, stroke-width .2s; }
  .node.s-no > rect, .node.s-no > circle, .node.s-no > polygon {
          fill: var(--paper); stroke: #A39A8C; stroke-width: 1; }
  .node.nocol > * { fill: #8E867A; }
  .node.ghost > * { fill: none !important; stroke: #C98AA6 !important; stroke-dasharray: 2 2; }
  .lab { font-size: 7.5px; fill: var(--ink); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #ped.zoomed .node.s-yes .lab { opacity: .85; }
  .node:hover > :first-child, .node.hov > :first-child { stroke: var(--ink); stroke-width: 2.4; }
  .node:hover .lab, .node.hov .lab { opacity: 1; }

  /* focus states */
  #ped.focus .edge { opacity: .07; }
  #ped.focus .edge.hi { opacity: .95; stroke: var(--ink); stroke-width: 1.8; }
  #ped.focus .node { opacity: .16; }
  #ped.focus .node.sel, #ped.focus .node.r1, #ped.focus .node.r2, #ped.focus .node.sub { opacity: 1; }
  #ped.focus .node.r2:not(.sel):not(.r1) { opacity: .75; }
  .node.sel > :first-child { stroke: var(--ink); stroke-width: 3; }
  .node.sel .lab, .node.r1 .lab { opacity: 1; font-weight: 600; }
  .node.sel .lab { font-size: 10px; }
  .halo { fill: none; stroke: var(--sel); stroke-width: 4; opacity: .9; pointer-events: none; }

  /* ── controls + card ── */
  #head { position: absolute; left: 18px; top: 14px; right: 18px; pointer-events: none; }
  #head h1 { font-size: 17px; font-weight: 650; margin: 0 0 2px; letter-spacing: .01em; }
  #head p  { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 46ch; line-height: 1.4; }
  #tools { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column;
           align-items: flex-end; gap: 8px; }
  .seg { display: inline-flex; background: #fff8; border: 1px solid #CFC5B5; border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: none; font: inherit; font-size: 12px; padding: 5px 9px; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 210px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #CFC5B5; background: #fff8;
          border-radius: 20px; padding: 2px 8px 2px 4px; font: inherit; font-size: 11.5px; cursor: pointer; color: var(--ink); }
  .chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  .tool { border: 1px solid #CFC5B5; background: #fff8; border-radius: 7px; font: inherit; font-size: 12px;
          padding: 5px 10px; cursor: pointer; color: var(--ink); }

  #card { position: absolute; left: 14px; bottom: 14px; width: min(340px, calc(100% - 28px));
          background: #FBF8F2; border: 1px solid #D6CCBC; border-radius: 9px; padding: 12px 14px;
          font-size: 12.5px; line-height: 1.45; box-shadow: 0 2px 10px #0000001a; display: none;
          max-height: 46%; overflow: auto; }
  #card.on { display: block; }
  #card h2 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
  #card .meta { color: var(--muted); margin-bottom: 8px; }
  #card .tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  #card .tabs button { font: inherit; font-size: 12px; border: 1px solid #CFC5B5; background: #fff;
                       border-radius: 5px; padding: 2px 7px; cursor: pointer; }
  #card .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  #card dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 3px 8px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; }
  #card a { color: var(--ink); text-decoration: underline; text-decoration-color: #B8AE9E; cursor: pointer; }
  #card a.uns { color: var(--muted); text-decoration: none; cursor: default; }
  #card .x { margin-left: auto; border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .panel-label { position: absolute; top: 12px; left: 12px; z-index: 5; font-size: 12.5px;
                 background: #2B2722cc; color: #F3EDE2; padding: 4px 9px; border-radius: 6px; }
  #maplegend { position: absolute; left: 12px; bottom: 26px; z-index: 5; background: #2B2722cc; color: #F3EDE2;
               padding: 7px 10px; border-radius: 7px; font-size: 11.5px; line-height: 1.6; }
  #maplegend i { display: inline-block; width: 12px; height: 9px; margin-right: 6px; vertical-align: -1px; border: 1px solid #F3EDE2aa; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  map.on('mousemove', 'g-fill', e => {
    map.getCanvas().style.cursor = 'pointer';
    const id = e.features[0].properties.grave_id;
    if (hoverPit === id) return;
    if (hoverPit) map.setFeatureState({ source: 'g', id: hoverPit }, { hover: false });
    hoverPit = id; map.setFeatureState({ source: 'g', id }, { hover: true });
    document.querySelectorAll('.node.hov').forEach(n => n.classList.remove('hov'));
    (D.pits[id] || []).forEach(p => (nodesById[p] || []).forEach(n => n.classList.add('hov')));
  });
  map.on('mouseleave', 'g-fill', () => {
    map.getCanvas().style.cursor = '';
    if (hoverPit) map.setFeatureState({ source: 'g', id: hoverPit }, { hover: false });
    hoverPit = null;
    document.querySelectorAll('.node.hov').forEach(n => n.classList.remove('hov'));
  });
  map.on('click', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['g-fill'] })[0];
    if (!f) return clearAll();
    selectPit(f.properties.grave_id);
  });
});

function paintMap(pitSel, S, r1, r2) {
  if (!map.getSource('g')) return;
  const relPit = {}, any = S.size > 0 || pitSel;
  r2.forEach(i => { if (P[i].pit) relPit[P[i].pit] = 2; });
  r1.forEach(i => { if (P[i].pit) relPit[P[i].pit] = 1; });
  const selPits = new Set([...S].map(i => P[i].pit).filter(Boolean));
  if (pitSel) selPits.add(pitSel);
  graves.features.forEach(f => {
    const id = f.properties.grave_id, sel = selPits.has(id);
    map.setFeatureState({ source: 'g', id }, {
      sel, rel: sel ? 0 : (relPit[id] || 0), dim: any && !sel && !relPit[id] });
  });
  // dashed kin lines from the selected grave(s) to relatives' graves
  const lines = [];
  selPits.forEach(a => Object.entries(relPit).forEach(([b, deg]) => {
    if (b !== a && !selPits.has(b)) lines.push({ type: 'Feature', properties: { deg },
      geometry: { type: 'LineString', coordinates: [D.cent[a], D.cent[b]] } });
  }));
  map.getSource('kin').setData({ type: 'FeatureCollection', features: lines });
}

// ── selection ─────────────────────────────────────────────────────────────────
function paintPed(S, r1, r2, subSet) {
  const F = new Set([...S, ...r1, ...r2]), any = F.size > 0 || subSet;
  svg.classList.toggle('focus', !!any);
  svg.querySelectorAll('.halo').forEach(h => h.remove());
  Object.entries(nodesById).forEach(([id, gs]) => gs.forEach(g => {
    g.classList.toggle('sel', S.has(id)); g.classList.toggle('r1', r1.has(id));
    g.classList.toggle('r2', r2.has(id)); g.classList.toggle('sub', !!(subSet && subSet.has(id)));
  }));
  S.forEach(id => (nodesById[id] || []).forEach(g => {
    const b = g.firstElementChild.getBBox();
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'halo'); c.setAttribute('cx', b.x + b.width / 2); c.setAttribute('cy', b.y + b.height / 2);
    c.setAttribute('r', Math.max(b.width, b.height) / 2 + 6); g.parentNode.insertBefore(c, g);
  }));
  const G = subSet ? new Set([...F, ...subSet]) : F;
  edges.forEach(({ el, m }) => {
    const k = m.filter(x => G.has(x)).length;
    el.classList.toggle('hi', k >= 2);
  });
}

function selectPit(pit) {
  const ids = D.pits[pit] || [];
  current = { pit, ids, active: ids[0] };
  render({ zoom: true, fly: true });
}
function selectPeople(ids, opt = {}) {
  const pit = P[ids[0]].pit;
  const inPit = pit ? D.pits[pit] : ids;
  current = { pit, ids: inPit, active: ids[0] };
  render({ zoom: !opt.fromPed, fly: true });
}
function render(opt = {}) {
  subOn = null; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  if (!current) return;
  const act = current.active ? [current.active] : [];
  const { S, r1, r2, why } = relatives(act);
  current.ids.forEach(i => S.add(i));
  paintPed(S, r1, r2, null);
  paintMap(current.pit, S, r1, r2);
  showCard(current, why, r1, r2);
  if (opt.zoom && act.length) zoomTo([...S, ...r1]);
  if (opt.fly) fitPits([...S, ...r1, ...r2].map(i => P[i].pit).concat(current.pit || []));
}

function fitPits(pitList) {
  const pts = [...new Set(pitList.filter(Boolean))].map(p => D.cent[p]);
  if (!pts.length) return;
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(p => b.extend(p));
  map.fitBounds(b, { padding: { top: 70, bottom: 70, left: 60, right: 60 }, maxZoom: 20.5, duration: 700 });
}

// ── card ──────────────────────────────────────────────────────────────────────
const SEXN = { M: 'male', F: 'female', U: 'unknown' };
function link(id) {
  return P[id].s ? `<a data-go="${id}">${id}</a>` : `<a class="uns" title="not sampled">${id}</a>`;
}
function showCard(cur, why, r1, r2) {
  const { pit, ids, active } = cur;
  let h = '';
  if (!ids.length) {
    h = `<h2>${pit}<button class="x" aria-label="Close">×</button></h2>
         <div class="meta">This grave was not sampled, so it has no place in the pedigree.</div>`;
  } else {
    const d = P[active];
    const col = d.sub ? D.subs[d.sub] : '#B9B2A6';
    h = `<h2><span class="sw" style="background:${col}"></span>${active}<button class="x" aria-label="Close">×</button></h2>
         <div class="meta">${d.grave || 'no grave'}${ids.length > 1 ? ` · one of ${ids.length} individuals in this grave` : ''}</div>`;
    if (ids.length > 1)
      h += `<div class="tabs">${ids.map(i => `<button data-tab="${i}" aria-pressed="${i === active}">${i}</button>`).join('')}</div>`;
    const rows = [['sex', SEXN[d.sex]], ['age at death', d.age || '—'],
                  ['section', D.secnames[d.sec]]];
    if (d.sec === 'main') rows.push(['generation', d.gen], ['subpedigree', d.sub || '—']);
    const groups = {};
    [...r1, ...r2].forEach(i => (why[i] || []).forEach(w => (groups[w] ||= []).push(i)));
    const order = ['partner', 'parent', 'child', 'sibling', 'grandparent', 'grandchild', 'aunt / uncle', 'niece / nephew'];
    const PL = { partner: 'partners', parent: 'parents', child: 'children', sibling: 'siblings',
                 grandparent: 'grandparents', grandchild: 'grandchildren' };
    order.forEach(w => { if (groups[w]) rows.push([groups[w].length > 1 && PL[w] ? PL[w] : w,
                                                   groups[w].map(link).join(', ')]); });
    if (d.sec !== 'main' && !r1.size)
      rows.push(['', `<span style="color:var(--muted)">No first-degree relatives are drawn for this individual.</span>`]);
    h += `<dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
  }
  card.innerHTML = h; card.classList.add('on');
}
card.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), tab = e.target.closest('[data-tab]');
  if (e.target.closest('.x')) return clearAll();
  if (tab) { current.active = tab.dataset.tab; render({ zoom: true }); }
  if (go) selectPeople([go.dataset.go]);
});

function clearAll() {
  current = null; subOn = null; card.classList.remove('on');
  paintPed(new Set(), new Set(), new Set(), null);
  paintMap(null, new Set(), new Set(), new Set());
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
}

// ── controls ──────────────────────────────────────────────────────────────────
const setDeg = n => { degree = n;
  document.getElementById('deg1').setAttribute('aria-pressed', n === 1);
  document.getElementById('deg2').setAttribute('aria-pressed', n === 2);
  if (current) render(); };
document.getElementById('deg1').onclick = () => setDeg(1);
document.getElementById('deg2').onclick = () => setDeg(2);
document.getElementById('reset').onclick = () => { clearAll(); animateVB(VB0); };
document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
  const s = ch.dataset.sub, on = subOn !== s;
  clearAll();
  if (!on) return;
  subOn = s; ch.setAttribute('aria-pressed', 'true');
  const set = new Set(Object.keys(P).filter(i => P[i].sub === s));
  // add unsampled individuals linking members (unknown parents, partners)
  Object.keys(P).forEach(i => { if (!P[i].s) { const r = REL[i];
    if ([...r.p, ...r.c, ...r.m].some(x => set.has(x))) set.add(i); } });
  paintPed(new Set(), new Set(), new Set(), set);
  zoomTo([...set]);
  const pitsOn = new Set([...set].map(i => P[i].pit).filter(Boolean));
  if (map.getSource('g')) graves.features.forEach(f => map.setFeatureState({ source: 'g', id: f.properties.grave_id },
      { sel: false, rel: pitsOn.has(f.properties.grave_id) ? 1 : 0, dim: !pitsOn.has(f.properties.grave_id) }));
  map.getSource('kin') && map.getSource('kin').setData(EMPTY);
  fitPits([...pitsOn]);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearAll(); });
</script>
</body>
</html>
